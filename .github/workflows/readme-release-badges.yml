name: Update release docs

# Release Community Build publishes with github.token, which does not emit release
# events to other workflows. workflow_run is the primary trigger after publish.
#
# main requires status checks (DCO / description / dependency-review), so this
# job cannot push straight to the default branch. It opens a PR and merges once
# those checks pass. Bot commits are exempt from DCO.
on:
  release:
    types: [published, released, prereleased]
  workflow_run:
    workflows: ["Release Community Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-docs
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Resolve target branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
            $name = gh repo view "${{ github.repository }}" --json defaultBranchRef -q .defaultBranchRef.name
          }
          elseif ("${{ github.event_name }}" -eq "release") {
            $name = gh repo view "${{ github.repository }}" --json defaultBranchRef -q .defaultBranchRef.name
          }
          else {
            $name = "${{ github.ref_name }}"
            if ([string]::IsNullOrWhiteSpace($name)) {
              $name = gh repo view "${{ github.repository }}" --json defaultBranchRef -q .defaultBranchRef.name
            }
          }
          if ([string]::IsNullOrWhiteSpace($name)) {
            throw "Could not resolve default branch."
          }
          Write-Host "Target branch -> $name"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ github.token }}

      - name: Update README badges
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          & .\build\steps\Update-ReadmeReleaseBadges.ps1

      - name: Update THANKS.md contributors
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          & .\build\steps\Update-ThanksContributors.ps1

      - name: Commit, open PR, and merge
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ steps.branch.outputs.name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md THANKS.md
          $status = git status --porcelain README.md THANKS.md
          if ([string]::IsNullOrWhiteSpace($status)) {
            Write-Host "No README/THANKS changes to commit."
            exit 0
          }

          $head = "chore/release-docs-$env:RUN_ID"
          git switch -c $head
          git commit -m "chore: update release docs (badges + contributors)"
          git push -u origin HEAD

          $bodyPath = Join-Path $env:RUNNER_TEMP "release-docs-pr-body.md"
          @(
            '## What'
            'Refresh README release badges and THANKS.md contributors from the latest published GitHub releases.'
            ''
            '## Why'
            "The Update release docs workflow cannot push directly to ``$($env:BASE_BRANCH)`` under the PR required-checks ruleset. Landing via PR lets DCO, description, and dependency-review complete."
            ''
            '## Testing'
            '- Workflow regenerated README/THANKS from ``gh release list``'
            '- Required checks on this PR must pass before merge'
            ''
            '## Risk'
            'Low. Docs-only change to README badges and contributor thanks.'
          ) | Set-Content -LiteralPath $bodyPath -Encoding utf8

          $prUrl = gh pr create --repo $env:REPO --base $env:BASE_BRANCH --head $head `
            --title "chore: update release docs (badges + contributors)" `
            --body-file $bodyPath
          if ($LASTEXITCODE -ne 0) {
            throw "gh pr create failed"
          }
          Write-Host "Opened $prUrl"

          $prNumber = gh pr view $prUrl --repo $env:REPO --json number -q .number
          if ([string]::IsNullOrWhiteSpace($prNumber)) {
            throw "Could not resolve PR number from $prUrl"
          }

          # Poll until required checks appear, then watch them. Fail on red checks.
          $deadline = (Get-Date).AddMinutes(20)
          while ((Get-Date) -lt $deadline) {
            $checksJson = gh pr checks $prNumber --repo $env:REPO --json name,state,bucket 2>$null
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($checksJson) -and $checksJson -ne '[]') {
              break
            }
            Write-Host "Waiting for required checks to register..."
            Start-Sleep -Seconds 10
          }

          gh pr checks $prNumber --repo $env:REPO --watch --fail-fast
          if ($LASTEXITCODE -ne 0) {
            throw "Required checks failed for PR #$prNumber"
          }

          gh pr merge $prNumber --repo $env:REPO --squash --delete-branch `
            --subject "chore: update release docs (badges + contributors) (#$prNumber)"
          if ($LASTEXITCODE -ne 0) {
            throw "gh pr merge failed for PR #$prNumber"
          }
          Write-Host "Merged PR #$prNumber"
