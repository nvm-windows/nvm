name: Publish to WinGet

on:
  workflow_dispatch:
    inputs:
      release:
        description: Which GitHub Release to use — latest skips drafts and pre-releases
        required: true
        type: choice
        default: latest
        options:
          - latest
          - custom
      release_tag:
        description: Release tag when release=custom (e.g. v2.0.0-alpha.2). Required for custom; ignored for latest.
        required: false
        type: string
        default: ''
      dry_run:
        description: "Dry run (checked/default): validate only, no winget-pkgs PR. Uncheck to publish to WinGet."
        required: true
        default: true
        type: boolean
      install_test:
        description: "Silent install smoke test using release asset already on runner (not winget install). Fails on install or runtime validation errors."
        required: true
        default: true
        type: boolean
      verify_public_urls:
        description: "Verify anonymous GitHub release URLs download and match SHA256 (required for WinGet)."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: winget-${{ github.repository }}-${{ inputs.release }}-${{ inputs.release_tag }}-${{ inputs.dry_run }}
  cancel-in-progress: false

env:
  WINGET_PACKAGE_IDENTIFIER: AuthorSoftware.NVMforWindows

jobs:
  validate:
    name: Generate and validate manifest
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      manifest_dir: ${{ steps.validate.outputs.manifest_dir }}
    steps:
      - name: Checkout manifest generator
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            build/steps/New-WingetManifest.ps1
            installer/setup.iss
            tests/installer/test-zero-admin-contract.ps1
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Validate zero-admin installer contract
        shell: pwsh
        run: .\tests\installer\test-zero-admin-contract.ps1

      - name: Resolve release tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHOICE: ${{ inputs.release }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          VERIFY_PUBLIC_URLS: ${{ inputs.verify_public_urls }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          function Test-WorkflowBool([string]$Value) {
            if ([string]::IsNullOrWhiteSpace($Value)) { return $false }
            return [System.Convert]::ToBoolean($Value)
          }

          $dryRun = Test-WorkflowBool $env:DRY_RUN
          $verifyPublicUrls = Test-WorkflowBool $env:VERIFY_PUBLIC_URLS
          if (-not $dryRun -and -not $verifyPublicUrls) {
            throw "verify_public_urls must be true when dry_run is false (WinGet needs anonymous download URLs)."
          }

          $repo = '${{ github.repository }}'
          if ($env:RELEASE_CHOICE -eq 'latest') {
            $releases = @(gh release list --repo $repo --exclude-drafts --exclude-pre-releases --limit 1 --json tagName | ConvertFrom-Json)
            if ($releases.Count -lt 1 -or [string]::IsNullOrWhiteSpace([string]$releases[0].tagName)) {
              throw "No non-draft, non-prerelease GitHub Release found in $repo."
            }
            $tag = [string]$releases[0].tagName
            Write-Host "Resolved latest release tag -> $tag"
          }
          else {
            $tag = [string]($env:RELEASE_TAG_INPUT).Trim()
            if ([string]::IsNullOrWhiteSpace($tag)) {
              throw "release=custom requires release_tag (for example v2.0.0)."
            }
          }

          if ($tag -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "release tag must be SemVer, optionally prefixed with v: $tag"
          }
          gh release view $tag --repo $repo --json tagName,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release not found: $tag" }

          $version = $tag -replace '^[vV]', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download released installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo "${{ github.repository }}" `
            --pattern 'nvm-*-setup.exe' `
            --dir release-assets `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to download release installers." }
          Get-ChildItem -LiteralPath release-assets -File | ForEach-Object {
            Write-Host "release asset -> $($_.Name) ($($_.Length) bytes)"
          }

      - name: Generate WinGet manifest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          & .\build\steps\New-WingetManifest.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -Repository $env:REPOSITORY `
            -InstallerDirectory (Join-Path $PWD 'release-assets') `
            -OutputDirectory (Join-Path $PWD 'winget-output')

      - name: Verify public release URLs and hashes
        if: inputs.verify_public_urls == true
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          $version = $tag -replace '^[vV]', ''
          $failed = $false

          foreach ($arch in @('amd64', 'arm64')) {
            $asset = "nvm-$version-$arch-setup.exe"
            $source = Join-Path $PWD "release-assets\$asset"
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Expected downloaded asset missing: $source"
            }

            $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$asset"
            $download = Join-Path $env:RUNNER_TEMP $asset
            try {
              Invoke-WebRequest -Uri $url -OutFile $download
            }
            catch {
              $failed = $true
              Write-Warning "Public URL check failed for ${asset}: $($_.Exception.Message)"
              continue
            }

            $expected = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
            $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash
            if ($actual -ne $expected) {
              $failed = $true
              Write-Warning "Public URL hash mismatch for $asset. expected=$expected actual=$actual"
              continue
            }
            Write-Host "Public URL + SHA256 verified -> $asset"
          }

          if ($failed) {
            throw "Public URL verification failed. Release assets must be anonymously downloadable before WinGet publish."
          }

      - name: Validate manifest with WinGet
        id: validate
        run: |
          $version = ($env:RELEASE_TAG.Trim() -replace '^[vV]', '')
          $manifestDir = Join-Path $PWD "winget-output\manifests\a\AuthorSoftware\NVMforWindows\$version"
          $manifest = Join-Path $manifestDir "$env:WINGET_PACKAGE_IDENTIFIER.yaml"
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw "Version manifest missing: $manifest"
          }
          winget --version
          winget validate --manifest $manifestDir --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed." }
          "manifest=$manifest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_dir=$manifestDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install smoke test (optional)
        id: install_test
        if: inputs.install_test == true
        timeout-minutes: 5
        run: |
          function Fail-InstallTest([string]$Reason) {
            throw "Install smoke test prerequisite failed: $Reason"
          }

          # Run the amd64 Inno installer from release-assets (already downloaded above).
          # winget install --manifest re-downloads from GitHub and can hang on GHA
          # (elevation prompts, winget dependency resolution).
          $version = $env:RELEASE_TAG.Trim() -replace '^[vV]', ''
          $installer = Join-Path $PWD "release-assets\nvm-$version-amd64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Fail-InstallTest "release asset missing: $installer"
          }

          Write-Host "Running local installer smoke test -> $installer"
          $proc = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(240000)) {
            try { $proc.Kill($true) } catch { $proc.Kill() }
            throw "Installer did not finish within 4 minutes."
          }
          if ($proc.ExitCode -ne 0) {
            throw "Installer exited with code $($proc.ExitCode)."
          }

          $nvm = Join-Path $env:LOCALAPPDATA 'Author Software\nvm\nvm.exe'
          if (-not (Test-Path -LiteralPath $nvm -PathType Leaf)) {
            throw "nvm.exe missing after install."
          }

          & $nvm --version 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "nvm --version failed after install."
          }

          Write-Host "Install smoke test passed."
          "ran=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Uninstall test installation
        if: always() && inputs.install_test == true && steps.install_test.outputs.ran == 'true'
        run: |
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Author Software\nvm\unins000.exe'
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            $proc = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -NoNewWindow
            if (-not $proc.WaitForExit(120000)) {
              try { $proc.Kill($true) } catch { $proc.Kill() }
              Write-Warning "Test uninstaller did not finish within 2 minutes (ignored)."
            }
            elseif ($proc.ExitCode -ne 0) {
              Write-Warning "Test uninstaller exited with code $($proc.ExitCode) (ignored)."
            }
          }
          else {
            Write-Host "No uninstaller found; nothing to clean up."
          }

      - name: Upload generated manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifest-${{ steps.meta.outputs.tag || github.run_id }}
          path: winget-output/manifests/
          if-no-files-found: warn
          retention-days: 30

      - name: Submit to microsoft/winget-pkgs
        if: inputs.dry_run == false
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          MANIFEST_DIR: ${{ steps.validate.outputs.manifest_dir }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "dry_run is false but secret WINGET_CREATE_GITHUB_TOKEN is empty. Set a classic PAT with public_repo on a fork of microsoft/winget-pkgs."
          }

          $wingetCreate = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest `
            -Uri 'https://aka.ms/wingetcreate/latest' `
            -OutFile $wingetCreate

          & $wingetCreate --info
          & $wingetCreate submit $env:MANIFEST_DIR --no-open
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit failed." }
