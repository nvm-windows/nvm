name: require-main

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  reject:
    name: target-main
    runs-on: ubuntu-latest
    steps:
      - name: PRs must target main
        run: |
          echo "This repository's default branch is main. Open the pull request against main, not master."
          exit 1
